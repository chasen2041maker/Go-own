[wiki]
version = 1
language = "zh-CN"
portal = "docs/README.md"
generated_dir = "docs/wiki"
generated_pages = ["document-catalog", "context-routes"]
max_context_documents = 4

[scope]
include = ["*.md", "**/*.md"]
exclude = [".git/**", "HANDOFF.md", "practice/**/tasks.md"]
historical = [
  "docs/plans/spec-go-learning-foundation.md",
  "docs/plans/spec-refactor-learning-structure.md",
  "docs/plans/spec-address-review-feedback.md",
]

