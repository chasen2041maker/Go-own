[[routes]]
id = "project-structure"
keywords = ["项目结构", "目录", "重构", "project"]
path_globs = ["README.md", "practice/**", "projects/**", "docs/**"]
context_docs = ["docs-home", "@nearest-readme"]
suggest_update_docs = ["docs-home", "@nearest-readme"]
gate_globs = []
require_update_any = []
require_update_all = []

[[routes]]
id = "investment-community"
keywords = ["投资社区", "治理", "举报", "审核", "通知", "MySQL", "starter", "reference"]
